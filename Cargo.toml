[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
authors = ["Lach <iam@lach.pw>"]
repository = "https://github.com/CertainLach/BifrostLink"
homepage = "https://github.com/CertainLach/BifrostLink"
documentation = "https://docs.rs/bifrostlink"
keywords = ["rpc", "async", "topology", "tokio", "networking"]
categories = ["network-programming", "asynchronous"]

[workspace.dependencies]
bifrostlink = { version = "0.2.1", path = "crates/bifrostlink" }
bifrostlink-macros = { version = "0.2.1", path = "crates/bifrostlink-macros" }
bifrostlink-ports = { version = "0.2.1", path = "crates/bifrostlink-ports" }

async-trait = "0.1.77"
async_fn_traits = "0.1.1"
bytes = "1.7.1"
derivative = "2.2.0"
futures = "0.3.28"
proc-macro2 = "1.0.94"
quote = "1.0.36"
serde = "1.0.163"
serde_json = "1.0.96"
syn = "2.0.100"
tokio = "1.39.2"
tracing = "0.1.40"
uuid = "1.3.3"
